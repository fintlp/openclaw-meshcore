    <g fill="none" stroke="#F0563A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 196 C214 162 178 112 158 90 Q148 78 130 72"/>
      <path d="M268 196 C298 162 334 112 354 90 Q364 78 382 72"/>
    </g>
    <!-- arms (attach at the front of the carapace) -->
    <g fill="none" stroke="#F0563A" stroke-width="19" stroke-linecap="round">
      <path d="M222 222 C192 234 152 238 134 200"/>
      <path d="M290 222 C320 234 360 238 378 200"/>
    </g>
    <!-- carapace + eyes -->
    <path d="M256 186 L266 200 C290 202 312 228 312 256 C312 280 296 294 276 294 L236 294 C216 294 200 280 200 256 C200 228 222 202 246 200 Z"/>
    <circle cx="238" cy="198" r="10"/>
    <circle cx="274" cy="198" r="10"/>
    <!-- segmented tail -->
    <rect x="206" y="300" width="100" height="23" rx="11"/>
    <rect x="212" y="330" width="88" height="23" rx="11"/>
    <rect x="218" y="360" width="76" height="23" rx="11"/>
    <rect x="225" y="390" width="62" height="21" rx="10"/>
    <!-- tail fan: telson + two pairs of uropods -->
    <ellipse cx="256" cy="432" rx="12" ry="29"/>
    <ellipse cx="245.42" cy="429.75" rx="11.5" ry="28" transform="rotate(24 245.42 429.75)"/>
    <ellipse cx="266.58" cy="429.75" rx="11.5" ry="28" transform="rotate(-24 266.58 429.75)"/>
    <ellipse cx="236.68" cy="423.4" rx="11" ry="26" transform="rotate(48 236.68 423.4)"/>
    <ellipse cx="275.32" cy="423.4" rx="11" ry="26" transform="rotate(-48 275.32 423.4)"/>
  </g>
  <g fill="#0D1626">
    <circle cx="238" cy="197" r="5"/>
    <circle cx="274" cy="197" r="5"/>
  </g>
</svg>
