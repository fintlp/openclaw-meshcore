<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#0D1626"/>
  <!-- radio waves: concentric arcs from the head, framed by the antennae -->
  <g fill="none" stroke="#6BE3F0" stroke-width="18" stroke-linecap="round">
    <path d="M231.59 136.09 A52 52 0 0 1 280.41 136.09"/>
    <path d="M213.74 102.54 A90 90 0 0 1 298.26 102.54" stroke-opacity="0.7"/>
    <path d="M195.90 68.99 A128 128 0 0 1 316.10 68.99" stroke-opacity="0.45"/>
  </g>
  <!-- claws -->
  <g transform="translate(128 190) rotate(-28)"><ellipse cx="0" cy="-60" rx="42" ry="64" fill="#FF7A52"/><g fill="#0D1626"><circle cx="2" cy="-92" r="19"/><path d="M-6 -96 L12 -96 L26 -140 L-20 -140 Z"/></g></g>
  <g transform="translate(384 190) rotate(28) scale(-1 1)"><ellipse cx="0" cy="-60" rx="42" ry="64" fill="#FF7A52"/><g fill="#0D1626"><circle cx="2" cy="-92" r="19"/><path d="M-6 -96 L12 -96 L26 -140 L-20 -140 Z"/></g></g>
  <g fill="#F0563A">
